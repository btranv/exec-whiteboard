name: Evening digest (EOD wrap)
on:
  schedule:
    # 23:00 UTC = 7:00 PM EDT (UTC-4) / 6:00 PM EST (UTC-5).
    # Update the cron when DST ends if you want strict 7pm year-round.
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Reconstruct secret files
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
          GCP_CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS_JSON }}
          SECTOR_CONFIG_JSON: ${{ secrets.SECTOR_CONFIG_JSON }}
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        run: |
          printf '%s' "$ANTHROPIC_API_KEY" > .anthropic_key
          printf '%s' "$FIGMA_TOKEN" > .figma_token
          printf '%s' "$GMAIL_TOKEN_JSON" > .gmail_token.json
          printf '%s' "$GCP_CREDENTIALS_JSON" > .gcp_credentials.json
          printf '%s' "$SECTOR_CONFIG_JSON" > .sector_config.json
          printf '%s' "$AIRTABLE_TOKEN" > .airtable_token
          chmod 600 .anthropic_key .figma_token .gmail_token.json .gcp_credentials.json .sector_config.json .airtable_token
      - name: Send digest
        run: python daily_digest.py evening
